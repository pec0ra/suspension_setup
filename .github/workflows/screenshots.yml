name: iOS Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E "iPhone|iPad"

      - name: Take screenshots
        run: |
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep "iPhone 16 Plus" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: No 'iPhone 16 Plus' simulator found. Available simulators:"
            xcrun simctl list devices available | grep -E "iPhone|iPad"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID"
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshot_test.dart \
            --profile \
            -d "$DEVICE_ID"
          xcrun simctl shutdown "$DEVICE_ID"

      - name: Crop status bar area
        # iPhone 16 Plus safe area: 59pt × 3x scale = 177 physical pixels
        run: |
          for f in screenshots/*.png; do
            H=$(sips -g pixelHeight "$f" | awk '/pixelHeight/{print $2}')
            W=$(sips -g pixelWidth "$f" | awk '/pixelWidth/{print $2}')
            sips -c $((H - 177)) $W --cropOffset 0 177 "$f"
          done

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: "screenshots/*.png"
          if-no-files-found: error