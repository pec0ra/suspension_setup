name: Screenshots

on:
  workflow_dispatch:

jobs:
  ios:
    runs-on: macos-latest

    strategy:
      fail-fast: false
      matrix:
        device:
          - name: "iPhone 16 Plus"
            artifact: iphone-screenshots
          - name: "iPad Pro 13-inch"
            artifact: ipad-screenshots

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Take screenshots
        run: |
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep "${{ matrix.device.name }}" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            echo "ERROR: No '${{ matrix.device.name }}' simulator found. Available simulators:"
            xcrun simctl list devices available | grep -E "iPhone|iPad"
            exit 1
          fi
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshot_test.dart \
            -d "$DEVICE_ID"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device.artifact }}
          path: "screenshots/*.png"
          if-no-files-found: error

  android:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Take screenshots
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: >-
            flutter drive
            --driver=test_driver/integration_test.dart
            --target=integration_test/screenshot_test.dart

      - uses: actions/upload-artifact@v4
        with:
          name: android-screenshots
          path: "screenshots/*.png"
          if-no-files-found: error