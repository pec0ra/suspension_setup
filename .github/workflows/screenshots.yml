name: iOS Screenshots

on:
  workflow_dispatch:

jobs:
  screenshots:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Set up Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: List available simulators
        run: xcrun simctl list devices available | grep -E "iPhone|iPad"

      - name: Take screenshots (6.7")
        run: |
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep "iPhone 16 Plus" | head -1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE_ID"
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshot_test.dart \
            -d "$DEVICE_ID"
          xcrun simctl shutdown "$DEVICE_ID"

      - name: Take screenshots (5.5")
        run: |
          DEVICE_ID=$(xcrun simctl list devices available \
            | grep "iPhone 8 Plus" | head -1 | grep -oE '[0-9A-F-]{36}')
          xcrun simctl boot "$DEVICE_ID"
          flutter drive \
            --driver=test_driver/integration_test.dart \
            --target=integration_test/screenshot_test.dart \
            -d "$DEVICE_ID"
          xcrun simctl shutdown "$DEVICE_ID"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: ios-screenshots
          path: "screenshots/**/*.png"
          if-no-files-found: error